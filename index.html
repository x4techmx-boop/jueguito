<script>
'use strict';
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
const TAU=Math.PI*2;
function seeded(seed){return ()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
function boardLayout(w,h){
  const portrait=w/h<1.05;
  const W=portrait?510:Math.max(1180,345*w/h),H=W*h/w;
  const trayW=portrait?80:clamp(W*.095,106,140),trayH=portrait?70:clamp(H*.192,67,99);
  const trayY=portrait?H*.234:H*.479;
  const tx=portrait?.218:.162;
  return {W,H,portrait,trayW,trayH,trays:[{x:W*tx,y:trayY,side:0},{x:W*(1-tx),y:trayY,side:1}],
    cx:W*(portrait?.465:.483),cy:H*(portrait?.60:.504),
    restX:W*(portrait?.74:.657),restY:H*(portrait?.625:.57)};
}
function pill(id,type,x,y,a,size){
  const r=(type?5.05:7.35)*size,half=(type?5.9:0)*size,mass=type?.93:1;
  return {id,type,x,y,a,r,half,size,vx:0,vy:0,w:0,dx:Math.cos(a),dy:Math.sin(a),im:1/mass,ii:1/(mass*(r*r*.52+half*half*.64)),bin:-1,drop:0};
}
function closest(a,b){
  // Closest points of the two capsule spines, including zero-length spines.
  const ux=a.dx*a.half*2,uy=a.dy*a.half*2,vx=b.dx*b.half*2,vy=b.dy*b.half*2;
  const ax=a.x-ux*.5,ay=a.y-uy*.5,bx=b.x-vx*.5,by=b.y-vy*.5;
  const rx=ax-bx,ry=ay-by,A=ux*ux+uy*uy,E=vx*vx+vy*vy,F=vx*rx+vy*ry,C=ux*rx+uy*ry;
  let s=0,t=0;
  if(A<1e-8){if(E>1e-8)t=clamp(F/E,0,1)}
  else if(E<1e-8)s=clamp(-C/A,0,1);
  else{const B=ux*vx+uy*vy,den=A*E-B*B;if(den>1e-7)s=clamp((B*F-C*E)/den,0,1);t=(B*s+F)/E;
    if(t<0){t=0;s=clamp(-C/A,0,1)}else if(t>1){t=1;s=clamp((B-C)/A,0,1)}}
  return [ax+s*ux,ay+s*uy,bx+t*vx,by+t*vy];
}
function collide(a,b,impact){
  const range=a.r+b.r+a.half+b.half;
  if(Math.abs(a.x-b.x)>range || Math.abs(a.y-b.y)>range)return;
  const [ax,ay,bx,by]=closest(a,b);
  const dx=bx-ax,dy=by-ay,rr=a.r+b.r,dd=dx*dx+dy*dy;
  if(dd>=rr*rr)return;
  const d=Math.sqrt(dd);
  let nx,ny;
  if(d>.0001){nx=dx/d;ny=dy/d}
  else{const cx=b.x-a.x,cy=b.y-a.y;
    if(a.half>0){const sign=(cx*-a.dy+cy*a.dx>=0)?1:-1;nx=-a.dy*sign;ny=a.dx*sign}
    else{const len=Math.hypot(cx,cy);nx=len>.001?cx/len:1;ny=len>.001?cy/len:0}}
  const inv=a.im+b.im,cor=Math.max(0,rr-d-.045)*.76/inv;
  const px=(ax+a.r*nx+bx-b.r*nx)*.5,py=(ay+a.r*ny+by-b.r*ny)*.5;
  const rax=px-a.x,ray=py-a.y,rbx=px-b.x,rby=py-b.y;
  a.x-=nx*cor*a.im;a.y-=ny*cor*a.im;b.x+=nx*cor*b.im;b.y+=ny*cor*b.im;
  const rvx=b.vx-b.w*rby-a.vx+a.w*ray,rvy=b.vy+b.w*rbx-a.vy-a.w*rax;
  const vn=rvx*nx+rvy*ny;if(vn>=0)return true;
  const ca=rax*ny-ray*nx,cb=rbx*ny-rby*nx;
  const j=-(vn<-24?1.19:1)*vn/(inv+ca*ca*a.ii+cb*cb*b.ii);
  const tx=-ny,ty=nx,cta=rax*ty-ray*tx,ctb=rbx*ty-rby*tx;
  const jt=clamp(-(rvx*tx+rvy*ty)/(inv+cta*cta*a.ii+ctb*ctb*b.ii),-j*.32,j*.32);
  const ix=j*nx+jt*tx,iy=j*ny+jt*ty;
  a.vx-=ix*a.im;a.vy-=iy*a.im;a.w-=(rax*iy-ray*ix)*a.ii;
  b.vx+=ix*b.im;b.vy+=iy*b.im;b.w+=(rbx*iy-rby*ix)*b.ii;
  if(impact && -vn>40)impact(-vn,b.type);
  return true;
}
class TableWorld{
  constructor(layout,round,onScore,onImpact){
    this.l=layout;this.round=round;this.onScore=onScore;this.onImpact=onImpact;this.count=[0,0];this.bodies=[];
    const q=seeded((round*913871+35113)>>>0),types=Array.from({length:100},(_,i)=>i%2);
    for(let i=99;i>0;i--){const j=Math.floor(q()*(i+1));[types[i],types[j]]=[types[j],types[i]]}
    for(let i=0;i<100;i++){
      const ang=q()*TAU,rad=Math.sqrt(q())*(i%17===0?1.28:1),offX=Math.cos(ang)*105*rad,offY=Math.sin(ang)*77*rad;
      this.bodies.push(pill(i,types[i],layout.cx+offX,layout.cy+offY+offX*.15,q()*TAU,.92+q()*.15));
    }
    this.tool={x:layout.restX,y:layout.restY,tx:layout.restX,ty:layout.restY,a:1.10,ta:1.10,vx:0,vy:0,w:0,lift:false,air:0};
    // Relax the initial pour at rest; no hidden initial score.
    for(let k=0;k<48;k++)this.neighbours(null);
  }
  neighbours(sound){
    const grid=new Map(),stride=16384,cell=29;
    for(const b of this.bodies){
      const gx=Math.floor(b.x/cell),gy=Math.floor(b.y/cell);
      for(let y=-1;y<=1;y++){for(let x=-1;x<=1;x++){
        const list=grid.get((gy+y)*stride+gx+x);if(list)for(const a of list)if(a.bin===b.bin)collide(a,b,sound);
      }}
      const key=gy*stride+gx;let list=grid.get(key);if(!list){list=[];grid.set(key,list)}list.push(b);
    }
  }
  toolParts(){
    const t=this.tool,c=Math.cos(t.a),s=Math.sin(t.a);
    return [[-48,46,6.8],[36,30,9]].map(([off,half,r])=>({x:t.x+c*off,y:t.y+s*off,dx:c,dy:s,half,r,im:0,ii:0,w:t.w,vx:t.vx-t.w*s*off,vy:t.vy+t.w*c*off}));
  }
  pushPieces(parts,sound){
    let touched=false;
    for(const b of this.bodies){
      if(b.bin>=0)continue;
      for(const part of parts)if(collide(part,b,sound))touched=true;
    }
    return touched;
  }
  followCursor(x,y,dt,entering){
    const t=this.tool,startX=t.x,startY=t.y;
    t.tx=clamp(x,0,this.l.W);t.ty=clamp(y,0,this.l.H);
    const dx=t.tx-startX,dy=t.ty-startY,distance=Math.hypot(dx,dy);
    t.vx=0;t.vy=0;
    if(!entering && !t.lift && distance>0){
      // Bound only the impulse on a pill. The tool always reaches the pointer.
      const rate=Math.min(1/clamp(dt,1/240,.05),650/distance);
      t.vx=dx*rate;t.vy=dy*rate;
      const slices=Math.ceil(distance/5);
      for(let i=1;i<=slices;i++){
        t.x=startX+dx*i/slices;t.y=startY+dy*i/slices;

let soundOn=true,audioContext=null,noise=null,lastClick=0,wonAt=0,restoreData=null,lastLayoutKey='';
const keys=new Set();
try{soundOn=localStorage.getItem(AUDIO)!=='off';const d=JSON.parse(localStorage.getItem(SAVE)||'null');
  if(d && d.version===1 && Number.isSafeInteger(d.level) && d.level>0 && d.level<99999999 && Number.isFinite(d.w) && d.w>0 && Number.isFinite(d.h) && d.h>0 && Array.isArray(d.bodies) && d.bodies.length===100 && d.bodies.every(b=>Array.isArray(b)&&b.length===4&&b.every(Number.isFinite)&&[-1,0,1].includes(b[3]))){restoreData=d;level=d.level;hasMoved=true}
}catch{}
function syncSound(){const btn=$('#audio');btn.setAttribute('aria-pressed',String(soundOn));btn.title=btn.ariaLabel=soundOn?'Silenciar sonido':'Activar sonido';btn.querySelector('use').setAttribute('href',soundOn?'#sound':'#mute')}
function startSound(){
  if(!soundOn)return;
  try{if(!audioContext){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioContext=new A();noise=audioContext.createBuffer(1,Math.floor(audioContext.sampleRate*.08),audioContext.sampleRate);
      const a=noise.getChannelData(0),q=seeded(5957);for(let i=0;i<a.length;i++)a[i]=q()*2-1}
    if(audioContext.state==='suspended')audioContext.resume().catch(()=>{})}catch{}
}
function clickSound(v,type){
  if(!soundOn||!audioContext||audioContext.state!=='running')return;
  const now=audioContext.currentTime;if(now-lastClick<.048)return;lastClick=now;
  const src=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();
  src.buffer=noise;src.playbackRate.value=type?1.22:.95;filter.type='bandpass';filter.frequency.value=(type?2250:1450)+Math.min(400,v);filter.Q.value=1.7;
  gain.gain.setValueAtTime(Math.min(.104,.022+v*.00017),now);gain.gain.exponentialRampToValueAtTime(.00015,now+.042);
  src.connect(filter).connect(gain).connect(audioContext.destination);src.start(now);src.stop(now+.048);
}
function chime(done){
  if(!soundOn||!audioContext||audioContext.state!=='running')return;
  const now=audioContext.currentTime,notes=done?[392,493.88,587.33]:[523.25];
  notes.forEach((f,i)=>{const t=now+i*.13,osc=audioContext.createOscillator(),g=audioContext.createGain();osc.type='sine';osc.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(done?.055:.022,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.47);osc.connect(g).connect(audioContext.destination);osc.start(t);osc.stop(t+.5)});
}
function uiScore(){
  const [a,b]=world.count,n=a+b;$('#score').textContent=n;$('#fill').style.width=n+'%';$('.meter').setAttribute('aria-valuenow',n);
  $('#count0').textContent=String(a).padStart(2,'0')+' / 50';$('#count1').textContent=String(b).padStart(2,'0')+' / 50';$('#lot').textContent='LOTE N.º '+String(level).padStart(3,'0');
}
function onScore(p,counts){uiScore();dirty=true;wantsSave=true;const n=counts[0]+counts[1];
  if(n===100){wonAt=performance.now()+400;chime(true)}else if(n%10===0){chime(false);$('#announce').textContent=n+' de 100 piezas clasificadas.'}else clickSound(100,p.type);
}
function save(){
  if(!world||!hasMoved)return;
  try{localStorage.setItem(SAVE,JSON.stringify({version:1,level,w:layout.W,h:layout.H,bodies:world.bodies.map(b=>[+b.x.toFixed(3),+b.y.toFixed(3),+b.a.toFixed(3),b.bin])}))}catch{}
  wantsSave=false;
}
function restore(d){
  const old=boardLayout(d.w,d.h);world.l=old;world.count=[0,0];
  world.bodies.forEach((b,i)=>{const [x,y,a,bin]=d.bodies[i];Object.assign(b,{x:clamp(x,0,old.W),y:clamp(y,0,old.H),a,dx:Math.cos(a),dy:Math.sin(a),bin:bin===b.type?bin:-1});if(b.bin>=0)world.count[b.bin]++});
  if(Math.abs(old.W-layout.W)>.1||Math.abs(old.H-layout.H)>.1)world.reframe(layout);else world.l=layout;
}
function resize(){
  const rect=cv.getBoundingClientRect();if(!rect.width||!rect.height)return;
  const dpr=Math.min(window.devicePixelRatio||1,2),width=Math.round(rect.width*dpr),height=Math.round(rect.height*dpr);
  if(lastLayoutKey===width+'x'+height && world)return;lastLayoutKey=width+'x'+height;
  endMouseFollow();cv.width=width;cv.height=height;const next=boardLayout(rect.width,rect.height);
  if(!world){layout=next;world=new TableWorld(layout,level,onScore,clickSound);if(restoreData){restore(restoreData);restoreData=null}}else{world.reframe(next);layout=next}
  bg=bakeBoard(layout,width,height);layout.trays.forEach((t,i)=>{const tag=i?$('.tag.b'):$('.tag.a');tag.style.left=t.x/layout.W*100+'%';tag.style.top=(t.y+layout.trayH+(layout.portrait?11:14))/layout.H*100+'%'});
  $('#hint').classList.toggle('gone',hasMoved);$('#hint').setAttribute('aria-hidden',String(hasMoved));uiScore();renderTable(ctx,bg,world);dirty=false;lastInteraction=performance.now();balance=0;
  if(world.count[0]+world.count[1]===100&&!modal)openDialog('win');
}
function wake(){lastInteraction=performance.now();dirty=true;wantsSave=true;saveAfter=lastInteraction+650;if(!hasMoved){hasMoved=true;$('#hint').classList.add('gone');$('#hint').setAttribute('aria-hidden','true')}}
function stopPointer(){
  if(pointer!==null && cv.hasPointerCapture?.(pointer))cv.releasePointerCapture(pointer);
  pointer=null;lastPointer=null;grab=null;cv.classList.remove('drag');
}
function stopInputs(){stopPointer();endMouseFollow();rotateTouch=0;keys.clear();if(world)world.tool.lift=false;setLiftUI();lastInteraction=performance.now()}
function setLiftUI(){const up=world?.tool.lift||false;$('#lift').setAttribute('aria-pressed',String(up));$('#lift span').textContent=up?'Bajar':'Levantar'}
function toBoard(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*layout.W/r.width,y:(e.clientY-r.top)*layout.H/r.height}}
function pointerTarget(){if(!lastPointer||!grab)return;const t=world.tool,c=Math.cos(t.a),s=Math.sin(t.a);t.tx=lastPointer.x-(grab.x*c-grab.y*s);t.ty=lastPointer.y-(grab.x*s+grab.y*c)}
function endMouseFollow(){lastMouseTime=null;cv.classList.remove('mouse-follow')}
function followMouse(e){
  if(modal||!world||pointer!==null)return;
  const entering=lastMouseTime===null,p=toBoard(e);
  if(entering){
    cv.classList.add('mouse-follow');
    world.tool.lift=keys.has(' ');setLiftUI();
  }
  world.followCursor(p.x,p.y,entering?0:(e.timeStamp-lastMouseTime)/1000,entering);
  lastMouseTime=e.timeStamp;wake();
}
cv.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')followMouse(e)});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')endMouseFollow()});
cv.addEventListener('pointerdown',e=>{
  if(modal||!world||pointer!==null||e.button!==0)return;e.preventDefault();cv.focus({preventScroll:true});startSound();
  if(e.pointerType==='mouse'){followMouse(e);return}
  endMouseFollow();wake();pointer=e.pointerId;cv.setPointerCapture(pointer);cv.classList.add('drag');
  const p=toBoard(e),t=world.tool,c=Math.cos(t.a),s=Math.sin(t.a),dx=p.x-t.x,dy=p.y-t.y;const lx=dx*c+dy*s,ly=-dx*s+dy*c;
  if(lx>=-114&&lx<=91&&Math.abs(ly)<24)grab={x:lx,y:ly};
  else{grab={x:0,y:0};world.followCursor(p.x,p.y,0,true)}lastPointer=p;pointerTarget();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){followMouse(e);return}
  if(pointer!==e.pointerId)return;lastPointer=toBoard(e);pointerTarget();wake();
});
cv.addEventListener('pointercancel',e=>{if(e.pointerType==='mouse')endMouseFollow()});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(ev,e=>{if(pointer===e.pointerId){stopPointer();lastInteraction=performance.now();saveAfter=lastInteraction+1350;wantsSave=true}});
cv.addEventListener('wheel',e=>{if(modal)return;e.preventDefault();startSound();wake();world.tool.ta+=clamp(e.deltaY,-100,100)*.0032},{passive:false});
const playableKeys=['arrowleft','arrowright','arrowup','arrowdown','q','e',' '];
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();if(k==='escape'){e.preventDefault();if(e.repeat)return;if(modal)dismissDialog();else openDialog('pause');return}
  if(modal||e.altKey||e.ctrlKey||e.metaKey||!playableKeys.includes(k))return;
  if(e.target.closest?.('button') && k===' ' && lastMouseTime===null)return;e.preventDefault();startSound();wake();
  if(!keys.has(k)){if(k==='q'||k==='e')world.tool.ta+=(k==='e'?1:-1)*.085;if(k===' '){world.tool.lift=true;setLiftUI()}}
  keys.add(k);
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase(),wasHeld=keys.delete(k);if(k===' '&&world&&wasHeld){world.tool.lift=false;setLiftUI();wake()}});
for(const [id,sign] of [['#ccw',-1],['#cw',1]]){const btn=$(id);
  btn.addEventListener('pointerdown',e=>{if(modal)return;e.preventDefault();btn.setPointerCapture(e.pointerId);rotateTouch=sign;world.tool.ta+=.12*sign;startSound();wake()});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(ev,()=>rotateTouch=0);
  btn.addEventListener('click',e=>{if(!modal&&e.detail===0){world.tool.ta+=.25*sign;wake()}});
}
$('#lift').onclick=()=>{if(!modal){world.tool.lift=!world.tool.lift;setLiftUI();wake();startSound()}};
$('#audio').onclick=()=>{soundOn=!soundOn;if(soundOn){startSound();chime(false)}syncSound();try{localStorage.setItem(AUDIO,soundOn?'on':'off')}catch{}};
function restart(next){
  if(next)level++;world=new TableWorld(layout,level,onScore,clickSound);hasMoved=false;wonAt=0;wantsSave=false;uiScore();$('#hint').classList.remove('gone');$('#hint').setAttribute('aria-hidden','false');
  try{if(level===1)localStorage.removeItem(SAVE);else{hasMoved=true;save();hasMoved=false}}catch{}
  closeDialog();dirty=true;lastInteraction=performance.now();
}
function closeDialog(){
  modal='';$('#overlay').hidden=true;for(const el of [document.querySelector('header'),$('.mast'),$('.bottom')])el.inert=false;
  lastInteraction=performance.now();lastFrame=0;balance=0;cv.focus({preventScroll:true});dirty=true;
}
function dismissDialog(){if(modal==='win')return;if(world.count[0]+world.count[1]===100){openDialog('win');return}closeDialog()}
function openDialog(kind){
  if(!world)return;if(world.count[0]+world.count[1]===100 && kind!=='win')kind='win';
  stopInputs();save();modal=kind;wonAt=0;
  const amount=world.count[0]+world.count[1],lot='LOTE N.º '+String(level).padStart(3,'0');
  $('#dialoglot').textContent=lot;$('#overlay').hidden=false;$('#closeDialog').hidden=kind==='win';$('#closeDialog').style.display=kind==='win'?'none':'';
  for(const el of [document.querySelector('header'),$('.mast'),$('.bottom')])el.inert=true;
  const info={
    help:['Cómo jugar','<p>Separa las 100 piezas con la espátula. Puedes tomarte todo el tiempo que quieras.</p><ul class="helpsteps"><li><i></i>Tabletas amarillas a la bandeja izquierda.</li><li><i></i>Cápsulas lilas a la bandeja derecha.</li></ul><p>Mueve el cursor para empujar las pastillas. Mantén Espacio para pasar por encima y suéltalo para volver a empujar. Gira con Q y E o con la rueda del ratón.</p><p>En pantalla táctil, desliza el dedo y usa los botones para girar o levantar la espátula.</p>','A jugar',closeDialog],
    pause:['Mesa en pausa','<p>Llevas '+amount+' de 100 piezas clasificadas.</p>','Seguir jugando',closeDialog],
    reset:['¿Reiniciar este lote?','<p>Las 100 piezas volverán al centro de la mesa.</p>','Reiniciar lote',()=>restart(false)],
    win:['Lote completo','<p>Las 50 tabletas y las 50 cápsulas están en su bandeja. El siguiente lote trae una mezcla nueva.</p>','Siguiente lote',()=>restart(true)]
  }[kind];
  $('#dialogtitle').textContent=info[0];$('#dialogbody').innerHTML=info[1];const box=$('#dialogbuttons');box.replaceChildren();
  const primary=document.createElement('button');primary.className='modalbtn primary';primary.textContent=info[2];primary.onclick=()=>{startSound();info[3]()};box.append(primary);
  if(kind==='reset'){const cancel=document.createElement('button');cancel.className='modalbtn';cancel.textContent='Cancelar';cancel.onclick=closeDialog;box.append(cancel);cancel.focus({preventScroll:true})}else primary.focus({preventScroll:true});
}
$('#closeDialog').onclick=dismissDialog;$('#help').onclick=()=>openDialog('help');$('#pauseGame').onclick=()=>openDialog('pause');$('#reset').onclick=()=>openDialog('reset');
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))dismissDialog()});
$('#overlay').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const buttons=Array.from($('.dialog').querySelectorAll('button')).filter(b=>b.offsetWidth);const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
window.addEventListener('blur',()=>{stopInputs();save()});window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopInputs();save()}lastFrame=0;balance=0});
function frame(now){
  requestAnimationFrame(frame);if(!world||document.hidden)return;
  const dt=lastFrame?Math.min(.055,(now-lastFrame)/1000):0;lastFrame=now;
  if(modal){balance=0;return}
  if(wonAt&&now>wonAt){openDialog('win');return}
  const input={mx:Number(keys.has('arrowright'))-Number(keys.has('arrowleft')),my:Number(keys.has('arrowdown'))-Number(keys.has('arrowup')),turn:rotateTouch+Number(keys.has('e'))-Number(keys.has('q'))};
  if(input.mx||input.my||input.turn){lastInteraction=now;wantsSave=true;saveAfter=now+550}
  const animating=now-lastInteraction<3600 || pointer!==null;
  if(animating){balance+=dt;const step=1/120;while(balance>=step){pointerTarget();world.step(step,input);balance-=step}renderTable(ctx,bg,world);dirty=false}
  else if(dirty){renderTable(ctx,bg,world);dirty=false}
  if(wantsSave && now>=saveAfter && now-lastInteraction>500 && pointer===null)save();
}
syncSound();resize();new ResizeObserver(resize).observe(panel);requestAnimationFrame(frame);

</script></body></html>
